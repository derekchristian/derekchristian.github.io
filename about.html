<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================================
         DEREK CHRISTIAN — ABOUT
         about.html

         SECONDARY PAGE ARCHITECTURE
         ---------------------------------------------------------------------
         8px BLACK TOP RULE
         PAGE NAVIGATION
         1px GRAY BOTTOM RULE
         PAGE CONTENT

         ARCHITECTURAL RULE
         ---------------------------------------------------------------------
         Classes, IDs, component structure, and CSS are permanent.

         Future maintenance should only require:
         - Replacing biography text
         - Replacing image src values
         - Replacing href values

         Adding or changing content must NOT require renaming classes,
         restructuring components, or modifying the production architecture.
         ===================================================================== -->


    <!-- =====================================================================
         00 — DOCUMENT SETTINGS
         ===================================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Learn more about Derek Christian, his music, background, and work as an independent artist."
    >

    <title>About | Derek Christian</title>


    <!-- FAVICON -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="IMGS/favicon.svg"
    >


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lacquer&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================================
         INLINE PAGE CSS
         ===================================================================== -->

    <style>

        /* ==================================================================
           00 — GLOBAL CONFIGURATION
           ================================================================== */

        :root {

            /* COLORS */

            --color-black: #000000;
            --color-white: #ffffff;
            --color-muted-text: #666666;
            --color-rule: #d8d8d8;


            /* SITE WIDTHS */

            --page-width: 1180px;
            --content-width: 1000px;


            /* VERTICAL SPACING */

            --section-spacing: 90px;


            /* SITE HEADER */

            --site-header-top-rule: 8px;


            /* ABOUT */

            --about-column-gap:
                clamp(
                    3rem,
                    6vw,
                    6rem
                );

        }



        /* ==================================================================
           01 — RESET & BASE STYLES
           ================================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;

            background: var(--color-white);

            color: var(--color-black);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 16px;

            line-height: 1.5;

            overflow-x: hidden;
        }


        img {
            display: block;

            max-width: 100%;

            height: auto;
        }


        a {
            color: inherit;

            text-decoration: none;
        }


        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }



        /* ==================================================================
           02 — SITE HEADER

           SECONDARY PAGE STANDARD
           ------------------------------------------------------------------
           8px BLACK TOP RULE
           PAGE NAVIGATION
           1px GRAY BOTTOM RULE
           ================================================================== */

        .site-header {
            width: 100%;

            background: var(--color-white);

            border-top:
                var(--site-header-top-rule)
                solid
                var(--color-black);

            border-bottom:
                1px
                solid
                var(--color-rule);
        }


        .site-nav {
            width:
                min(
                    var(--page-width),
                    calc(100% - 3rem)
                );

            min-height: 64px;

            margin-inline: auto;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .site-nav-list {
            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: center;

            margin: 0;

            padding: 0;

            list-style: none;
        }


        .site-nav-link {
            display: block;

            padding:
                1.35rem
                1.5rem;

            color: var(--color-black);

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.16em;

            line-height: 1;

            text-transform: uppercase;

            opacity: 0.7;

            transition:
                opacity 180ms ease,
                transform 180ms ease;
        }


        .site-nav-link:hover,
        .site-nav-link:focus-visible {
            opacity: 1;

            transform: translateY(-1px);
        }



        /* ==================================================================
           03 — ABOUT

           Permanent About page architecture.

           DESKTOP
           ------------------------------------------------------------------
           Artist Image | Artist Biography

           TABLET / MOBILE
           ------------------------------------------------------------------
           Artist Image
           Artist Biography
           ================================================================== */

        .about {
            width: 100%;

            padding:
                var(--section-spacing)
                1.5rem
                var(--section-spacing);
        }


        .about-inner {
            width:
                min(
                    var(--content-width),
                    100%
                );

            margin-inline: auto;
        }


        .about-layout {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            align-items: center;

            column-gap: var(--about-column-gap);
        }



        /* ------------------------------------------------------------------
           03.1 — ABOUT IMAGE

           Permanent artist-image component.

           POPULATE:
           To use another photograph later, change only the img src.
           ------------------------------------------------------------------ */

        .about-image {
            width: 100%;

            justify-self: center;
        }


        .about-image img {
            width: 100%;

            height: auto;

            object-fit: cover;
        }



        /* ------------------------------------------------------------------
           03.2 — ABOUT CONTENT
           ------------------------------------------------------------------ */

        .about-content {
            width: 100%;
        }



        /* ------------------------------------------------------------------
           03.3 — ABOUT HEADING

           Uses the established Lacquer display treatment.
           ------------------------------------------------------------------ */

        .about-heading {
            margin:
                0
                0
                2.5rem;

            color: var(--color-black);

            font-family:
                "Lacquer",
                sans-serif;

            font-size:
                clamp(
                    2.25rem,
                    4.5vw,
                    3.75rem
                );

            font-weight: 400;

            line-height: 1;

            letter-spacing: 0;

            text-transform: uppercase;
        }



        /* ------------------------------------------------------------------
           03.4 — BIOGRAPHY
           ------------------------------------------------------------------ */

        .about-bio {
            width: 100%;
        }


        .about-bio p {
            margin:
                0
                0
                1.5rem;
        }


        .about-bio p:last-child {
            margin-bottom: 0;
        }



        /* ==================================================================
           04 — GLOBAL BUTTON STANDARD

           Against a solid white background:
           BLACK BUTTON
           WHITE TEXT
           ================================================================== */

        .button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 48px;

            padding:
                0.9rem
                1.6rem;

            border:
                2px
                solid
                var(--color-black);

            background: var(--color-black);

            color: var(--color-white);

            font: inherit;

            font-size: 0.72rem;

            font-weight: 600;

            line-height: 1;

            letter-spacing: 0.12em;

            text-align: center;

            text-decoration: none;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background-color 180ms ease,
                color 180ms ease,
                transform 180ms ease;
        }


        .button:hover {
            background: var(--color-white);

            color: var(--color-black);
        }


        .button:focus-visible {
            outline:
                2px
                solid
                var(--color-black);

            outline-offset: 4px;
        }


        .button:active {
            transform: translateY(1px);
        }



        /* ==================================================================
           05 — FOOTER

           Production B2C footer treatment.
           ================================================================== */

        .site-footer {
            width: 100%;

            padding:
                2.5rem
                1.5rem
                3rem;

            background: var(--color-white);

            text-align: center;
        }


        .footer-inner {
            width:
                min(
                    var(--content-width),
                    100%
                );

            margin-inline: auto;
        }



        /* ------------------------------------------------------------------
           05.1 — SOCIAL / DESTINATION ICONS
           ------------------------------------------------------------------ */

        .footer-socials {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 1.25rem;

            margin-bottom: 2rem;
        }


        .footer-socials a {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            opacity: 0.65;

            transition:
                opacity 180ms ease,
                transform 180ms ease;
        }


        .footer-socials a:hover,
        .footer-socials a:focus-visible {
            opacity: 1;

            transform: translateY(-1px);
        }


        .footer-social-icon {
            display: block;

            width: 20px;

            height: 20px;

            object-fit: contain;
        }



        /* ------------------------------------------------------------------
           05.2 — FOOTER LINKS
           ------------------------------------------------------------------ */

        .footer-links {
            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: center;

            gap:
                0.75rem
                1.75rem;
        }


        .footer-links a {
            font-size: 0.68rem;

            font-weight: 600;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            opacity: 0.6;

            transition:
                opacity
                180ms
                ease;
        }


        .footer-links a:hover,
        .footer-links a:focus-visible {
            opacity: 1;
        }



        /* ------------------------------------------------------------------
           05.3 — COPYRIGHT
           ------------------------------------------------------------------ */

        .copyright {
            margin:
                1.5rem
                0
                0;

            font-size: 0.65rem;

            opacity: 0.45;
        }



        /* ==================================================================
           06 — TABLET / MOBILE
           768px AND BELOW
           ================================================================== */

        @media (max-width: 768px) {


            /* --------------------------------------------------------------
               06.1 — GLOBAL
               -------------------------------------------------------------- */

            :root {
                --section-spacing: 75px;
            }



            /* --------------------------------------------------------------
               06.2 — SITE HEADER
               -------------------------------------------------------------- */

            .site-nav {
                width:
                    min(
                        var(--page-width),
                        calc(100% - 2rem)
                    );

                min-height: 58px;
            }


            .site-nav-link {
                padding:
                    1.2rem
                    1rem;

                font-size: 0.68rem;
            }



            /* --------------------------------------------------------------
               06.3 — ABOUT

               Image moves above biography.
               Existing components/classes remain unchanged.
               -------------------------------------------------------------- */

            .about-layout {
                grid-template-columns: 1fr;

                row-gap: 3rem;
            }


            .about-image {
                width:
                    min(
                        560px,
                        100%
                    );

                margin-inline: auto;
            }


            .about-content {
                width:
                    min(
                        560px,
                        100%
                    );

                margin-inline: auto;
            }


            .about-heading {
                margin-bottom: 2.25rem;

                font-size:
                    clamp(
                        2.1rem,
                        8vw,
                        3.25rem
                    );

                text-align: center;
            }

        }



        /* ==================================================================
           07 — SMALL MOBILE
           480px AND BELOW
           ================================================================== */

        @media (max-width: 480px) {


            /* --------------------------------------------------------------
               07.1 — GLOBAL
               -------------------------------------------------------------- */

            :root {
                --section-spacing: 60px;
            }


            body {
                font-size: 15px;
            }



            /* --------------------------------------------------------------
               07.2 — SITE HEADER
               -------------------------------------------------------------- */

            .site-nav {
                width: 100%;

                min-height: auto;

                padding:
                    0.35rem
                    0.5rem;
            }


            .site-nav-list {
                width: 100%;
            }


            .site-nav-link {
                padding:
                    0.9rem
                    0.65rem;

                font-size: 0.62rem;

                letter-spacing: 0.09em;
            }



            /* --------------------------------------------------------------
               07.3 — ABOUT
               -------------------------------------------------------------- */

            .about {
                padding-left: 1rem;

                padding-right: 1rem;
            }


            .about-layout {
                row-gap: 2.5rem;
            }


            .about-image {
                width:
                    min(
                        340px,
                        100%
                    );
            }


            .about-heading {
                margin-bottom: 2rem;

                font-size:
                    clamp(
                        1.9rem,
                        9vw,
                        2.75rem
                    );

                line-height: 1;
            }



            /* --------------------------------------------------------------
               07.4 — FOOTER
               -------------------------------------------------------------- */

            .footer-socials {
                gap: 1.1rem;

                margin-bottom: 1.75rem;
            }


            .footer-social-icon {
                width: 19px;

                height: 19px;
            }


            .site-footer {
                padding:
                    2.25rem
                    1rem
                    2.5rem;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================================
         01 — SITE HEADER

         SECONDARY PAGE STANDARD
         ---------------------------------------------------------------------
         8px BLACK TOP RULE
         PRIMARY NAVIGATION
         1px GRAY BOTTOM RULE

         No photographic hero.
         No Derek Christian branding hero.
         ===================================================================== -->

    <header class="site-header">

        <nav
            class="site-nav"
            aria-label="Primary navigation"
        >

            <ul class="site-nav-list">

                <li>
                    <a
                        class="site-nav-link"
                        href="index.html#music"
                    >
                        Music
                    </a>
                </li>

                <li>
                    <a
                        class="site-nav-link"
                        href="index.html#shop"
                    >
                        Shop
                    </a>
                </li>

                <li>
                    <a
                        class="site-nav-link"
                        href="shows.html"
                    >
                        Shows
                    </a>
                </li>

                <li>
                    <a
                        class="site-nav-link"
                        href="https://youtube.com/@derekchristianmusic?sub_confirmation=1"
                        target="_blank"
                        rel="noopener noreferrer"

                        Video
                    </a>
                </li>

                <li>
                    <a
                        class="site-nav-link"
                        href="index.html#signup"
                    >
                        Sign Up
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- =====================================================================
         MAIN CONTENT
         ===================================================================== -->

    <main>


        <!-- =================================================================
             02 — ABOUT

             DESKTOP
             -----------------------------------------------------------------
             1.png | Biography

             TABLET / MOBILE
             -----------------------------------------------------------------
             1.png
             Biography

             POPULATE:
             Replace the biography paragraphs with the final public-facing
             artist biography.

             The image is configured as:
             IMGS/1.png

             To replace the photograph later, change only the src value.
             ================================================================= -->

        <section
            class="about"
            id="about"
        >

            <div class="about-inner">

                <div class="about-layout">


                    <!-- =====================================================
                         ARTIST IMAGE
                         ===================================================== -->

                    <div class="about-image">

                        <img
                            src="IMGS/1.png"
                            alt="Derek Christian"
                        >

                    </div>



                    <!-- =====================================================
                         ARTIST BIOGRAPHY
                         ===================================================== -->

                    <div class="about-content">

                        <h1 class="about-heading">
                            About
                        </h1>


                        <div class="about-bio">

                            <!--
                                POPULATE:
                                Replace the paragraphs below with the final
                                Derek Christian public-facing biography.
                            -->

                            <p>
                                Derek Christian is an independent artist,
                                songwriter, and musician.
                            </p>

                            <p>
                                Artist biography coming soon.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================================
         03 — B2C FOOTER

         POPULATE:
         Replace social href values with production profile URLs.

         Shop currently returns to the homepage Shop section.
         When shop.html launches, change only that href.
         ===================================================================== -->

    <footer class="site-footer">

        <div class="footer-inner">


            <!-- =============================================================
                 SOCIAL / DESTINATION ICONS
                 ============================================================= -->

            <nav
                class="footer-socials"
                aria-label="Social media and shop"
            >


                <!-- FACEBOOK -->

                <a
                    href="https://facebook.com/officialderekchristianmusic"
                    aria-label="Derek Christian on Facebook"
                >
                    <img
                        src="IMGS/icons/facebook.svg"
                        alt=""
                        class="footer-social-icon"
                    >
                </a>


                <!-- INSTAGRAM -->

                <a
                    href="https://instagram.com/derekchristianmusic"
                    aria-label="Derek Christian on Instagram"
                >
                    <img
                        src="IMGS/icons/instagram.svg"
                        alt=""
                        class="footer-social-icon"
                    >
                </a>


                <!-- TIKTOK -->

                <a
                    href="https://tiktok.com/@derekchristianmusic"
                    aria-label="Derek Christian on TikTok"
                >
                    <img
                        src="IMGS/icons/tiktok.svg"
                        alt=""
                        class="footer-social-icon"
                    >
                </a>


                <!-- YOUTUBE -->

                <a
                    href="https://youtube.com/@derekchristianmusic?sub_confirmation=1"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Derek Christian on YouTube"
                >
                    <img
                        src="IMGS/icons/youtube.svg"
                        alt=""
                        class="footer-social-icon"
                    >
                </a>


                <!-- X -->

                <a
                    href="https://x.com/OfficialDerekCM"
                    aria-label="Derek Christian on X"
                >
                    <img
                        src="IMGS/icons/twitter-x.svg"
                        alt=""
                        class="footer-social-icon"
                    >
                </a>


                <!-- SHOP -->

                <a
                    href="index.html#shop"
                    aria-label="Derek Christian shop"
                >
                    <img
                        src="IMGS/icons/bag.svg"
                        alt=""
                        class="footer-social-icon"
                    >
                </a>

            </nav>



            <!-- =============================================================
                 FOOTER LINKS
                 ============================================================= -->

            <nav
                class="footer-links"
                aria-label="Footer navigation"
            >

                <a href="index.html">
                    Home
                </a>

                <a href="contact.html">
                    Contact
                </a>

                <a href="booking.html">
                    Booking
                </a>

                <a href="policy.html">
                    Policy
                </a>

            </nav>



            <!-- COPYRIGHT -->

            <p class="copyright">
                &copy; 2026 Derek Christian. All Rights Reserved.
            </p>

        </div>

    </footer>


</body>

</html>
