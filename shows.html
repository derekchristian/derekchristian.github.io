<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================================
         DEREK CHRISTIAN — SHOWS
         shows.html

         SECONDARY PAGE ARCHITECTURE
         ---------------------------------------------------------------------
         8px BLACK TOP RULE
         PAGE NAVIGATION
         1px GRAY BOTTOM RULE
         PAGE CONTENT

         PURPOSE
         ---------------------------------------------------------------------
         Dedicated public destination for current and upcoming live
         performance dates.

         The production Seated or Bandsintown widget handles:
         - Upcoming performance dates
         - Event information
         - Ticket / event actions
         - Built-in email / phone marketing CTA where supported

         ARCHITECTURAL RULE
         ---------------------------------------------------------------------
         Classes, IDs, component structure, and CSS are permanent.

         Future maintenance should only require:
         - Replacing widget code
         - Replacing href values
         - Replacing text

         Adding or changing content must NOT require renaming classes,
         restructuring components, or modifying production architecture.
         ===================================================================== -->


    <!-- =====================================================================
         00 — DOCUMENT SETTINGS
         ===================================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="See upcoming Derek Christian live performances and get updates on future shows."
    >

    <title>Shows | Derek Christian</title>


    <!-- FAVICON -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="IMGS/favicon.svg"
    >


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lacquer&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================================
         INLINE PAGE CSS
         ===================================================================== -->

    <style>

        /* ==================================================================
           00 — GLOBAL CONFIGURATION
           ================================================================== */

        :root {

            /* COLORS */

            --color-black: #000000;
            --color-white: #ffffff;
            --color-muted-text: #666666;
            --color-rule: #d8d8d8;


            /* SITE WIDTHS */

            --page-width: 1180px;
            --content-width: 1000px;


            /* VERTICAL SPACING */

            --section-spacing: 90px;


            /* SITE HEADER */

            --site-header-top-rule: 8px;

        }



        /* ==================================================================
           01 — RESET & BASE STYLES
           ================================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;

            background: var(--color-white);

            color: var(--color-black);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 16px;

            line-height: 1.5;

            overflow-x: hidden;
        }


        img {
            display: block;

            max-width: 100%;

            height: auto;
        }


        a {
            color: inherit;

            text-decoration: none;
        }


        iframe {
            display: block;

            max-width: 100%;

            border: 0;
        }


        button {
            font: inherit;
        }


        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }



        /* ==================================================================
           02 — SITE HEADER

           SECONDARY PAGE STANDARD
           ------------------------------------------------------------------
           8px BLACK TOP RULE
           PRIMARY NAVIGATION
           1px GRAY BOTTOM RULE
           ================================================================== */

        .site-header {
            width: 100%;

            background: var(--color-white);

            border-top:
                var(--site-header-top-rule)
                solid
                var(--color-black);

            border-bottom:
                1px
                solid
                var(--color-rule);
        }


        .site-nav {
            width:
                min(
                    var(--page-width),
                    calc(100% - 3rem)
                );

            min-height: 64px;

            margin-inline: auto;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .site-nav-list {
            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: center;

            margin: 0;

            padding: 0;

            list-style: none;
        }


        .site-nav-link {
            display: block;

            padding:
                1.35rem
                1.5rem;

            color: var(--color-black);

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.16em;

            line-height: 1;

            text-transform: uppercase;

            opacity: 0.7;

            transition:
                opacity 180ms ease,
                transform 180ms ease;
        }


        .site-nav-link:hover,
        .site-nav-link:focus-visible {
            opacity: 1;

            transform: translateY(-1px);
        }



        /* ==================================================================
           03 — SHOWS
           ================================================================== */

        .shows {
            width: 100%;

            min-height: 60vh;

            padding:
                var(--section-spacing)
                1.5rem;

            background: var(--color-white);
        }


        .shows-inner {
            width:
                min(
                    var(--content-width),
                    100%
                );

            margin-inline: auto;
        }


        .shows-title {
            margin:
                0
                0
                2.5rem;

            color: var(--color-black);

            font-family:
                "Lacquer",
                sans-serif;

            font-size:
                clamp(
                    2.25rem,
                    4.5vw,
                    3.75rem
                );

            font-weight: 400;

            line-height: 1;

            letter-spacing: 0;

            text-align: center;

            text-transform: uppercase;
        }



        /* ==================================================================
           04 — EVENTS WIDGET

           Permanent production container.

           Seated OR Bandsintown embed code belongs inside this container.

           The provider widget handles:
           - Upcoming performance dates
           - Event information
           - Ticket / event actions
           - Email / phone marketing CTA where supported
           ================================================================== */

        .events-widget {
            width: 100%;

            margin-inline: auto;
        }


        .events-widget iframe {
            display: block;

            width: 100%;

            max-width: 100%;

            border: 0;
        }



        /* ==================================================================
           05 — BUTTON STANDARD

           SITE-WIDE STANDARD
           ------------------------------------------------------------------
           Against solid white:
           BLACK BUTTON
           WHITE TEXT
           ================================================================== */

        .button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 210px;

            min-height: 52px;

            padding:
                0.9rem
                1.5rem;

            background: var(--color-black);

            color: var(--color-white);

            border:
                2px
                solid
                var(--color-black);

            border-radius: 0;

            cursor: pointer;

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.14em;

            line-height: 1;

            text-align: center;

            text-decoration: none;

            text-transform: uppercase;

            transition:
                background-color 180ms ease,
                color 180ms ease,
                transform 180ms ease;
        }


        .button:hover {
            background: var(--color-white);

            color: var(--color-black);
        }


        .button:focus-visible {
            outline:
                2px
                solid
                var(--color-black);

            outline-offset: 4px;
        }


        .button:active {
            transform: translateY(1px);
        }



        /* ==================================================================
           06 — B2C FOOTER
           ================================================================== */

        .site-footer {
            width: 100%;

            padding:
                2.5rem
                1.5rem
                3rem;

            background: var(--color-white);

            text-align: center;
        }


        .footer-inner {
            width:
                min(
                    var(--content-width),
                    100%
                );

            margin-inline: auto;
        }



        /* ------------------------------------------------------------------
           06.1 — SOCIAL / DESTINATION ICONS
           ------------------------------------------------------------------ */

        .footer-socials {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 1.25rem;

            margin-bottom: 2rem;
        }


        .footer-socials a {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            opacity: 0.65;

            transition:
                opacity 180ms ease,
                transform 180ms ease;
        }


        .footer-socials a:hover,
        .footer-socials a:focus-visible {
            opacity: 1;

            transform: translateY(-1px);
        }


        .footer-social-icon {
            display: block;

            width: 20px;

            height: 20px;

            object-fit: contain;
        }



        /* ------------------------------------------------------------------
           06.2 — FOOTER LINKS
           ------------------------------------------------------------------ */

        .footer-links {
            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: center;

            gap:
                0.75rem
                1.75rem;
        }


        .footer-links a {
            font-size: 0.68rem;

            font-weight: 600;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            opacity: 0.6;

            transition:
                opacity
                180ms
                ease;
        }


        .footer-links a:hover,
        .footer-links a:focus-visible {
            opacity: 1;
        }



        /* ------------------------------------------------------------------
           06.3 — COPYRIGHT
           ------------------------------------------------------------------ */

        .copyright {
            margin:
                1.5rem
                0
                0;

            font-size: 0.65rem;

            opacity: 0.45;
        }



        /* ==================================================================
           07 — TABLET / MOBILE
           768px AND BELOW
           ================================================================== */

        @media (max-width: 768px) {

            :root {
                --section-spacing: 70px;
            }



            /* SITE HEADER */

            .site-nav {
                width:
                    min(
                        var(--page-width),
                        calc(100% - 2rem)
                    );

                min-height: 58px;
            }


            .site-nav-link {
                padding:
                    1.2rem
                    1rem;

                font-size: 0.68rem;
            }



            /* SHOWS */

            .shows {
                min-height: 55vh;
            }

        }



        /* ==================================================================
           08 — SMALL MOBILE
           480px AND BELOW
           ================================================================== */

        @media (max-width: 480px) {

            :root {
                --section-spacing: 60px;
            }


            body {
                font-size: 15px;
            }



            /* SITE HEADER */

            .site-nav {
                width: 100%;

                min-height: auto;

                padding:
                    0.35rem
                    0.5rem;
            }


            .site-nav-list {
                width: 100%;
            }


            .site-nav-link {
                padding:
                    0.9rem
                    0.65rem;

                font-size: 0.62rem;

                letter-spacing: 0.09em;
            }



            /* SHOWS */

            .shows {
                min-height: 50vh;

                padding-left: 1rem;

                padding-right: 1rem;
            }


            .shows-title {
                font-size:
                    clamp(
                        1.9rem,
                        9vw,
                        2.75rem
                    );
            }



            /* FOOTER */

            .site-footer {
                padding:
                    2.25rem
                    1rem
                    2.5rem;
            }


            .footer-socials {
                gap: 1.1rem;

                margin-bottom: 1.75rem;
            }


            .footer-social-icon {
                width: 19px;

                height: 19px;
            }

        }

    </style>

</head>
